<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Chess Thought Recorder</h1>
  <div id="status">Microphone: off</div>
  <div id="meter"><div id="meterFill"></div></div>
  <div id="settings">
    <label>Sensitivity (0–10)
      <input type="number" id="sensNum" min="0" max="10" step="0.1" value="4">
    </label>
    <label>Silence (seconds)
      <input type="number" id="silNum" min="0.5" max="5" step="0.1" value="2">
    </label>
    <label>Language
      <select id="langSel">
        <option value="auto" selected>Auto</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
      </select>
    </label>
    <label class="checkline">
      <input type="checkbox" id="saveAudioChk">
      Save audio file (debug)
    </label>
  </div>
  <div id="segments"></div>
  <div>
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
